<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8f4ed">
  <title>Portail Vital | Télécommande</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #19332c;
      --muted: #71827b;
      --paper: #f4f8f4;
      --surface: #ffffff;
      --line: #dce8df;
      --green: #217a55;
      --green-dark: #185c40;
      --orange: #f47755;
      --orange-dark: #d95c3e;
      --shadow: 0 22px 60px rgba(35, 75, 56, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#b9d7c3 0.8px, transparent 0.8px);
      background-size: 22px 22px;
      font-family: "DM Sans", sans-serif;
    }

    button { font: inherit; }

    .remote {
      width: min(100%, 420px);
      padding: 24px;
      border: 1px solid rgba(220, 232, 223, .9);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: arrive .45s ease-out both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--green);
    }

    .brand-mark img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .brand-name {
      overflow: hidden;
      font-family: "Space Grotesk", sans-serif;
      font-size: 17px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .device-tag {
      flex: 0 0 auto;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: 30px;
      line-height: 1.12;
    }

    .subtitle {
      margin: 9px 0 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .status-panel {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fbf8;
    }

    .status-light {
      width: 11px;
      height: 11px;
      flex: 0 0 11px;
      border-radius: 50%;
      background: #e7ad45;
      box-shadow: 0 0 0 4px rgba(231, 173, 69, .14);
    }

    .status-panel[data-state="connected"] .status-light {
      background: #38a86c;
      box-shadow: 0 0 0 4px rgba(56, 168, 108, .14);
    }

    .status-panel[data-state="error"] .status-light {
      background: var(--orange);
      box-shadow: 0 0 0 4px rgba(244, 119, 85, .14);
    }

    #status {
      margin: 0;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .action-button {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: background-color .16s ease, border-color .16s ease, transform .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .action-button:active { transform: scale(.985); }
    .action-button:focus-visible { outline: 3px solid #f4b19e; outline-offset: 3px; }

    .action-primary {
      min-height: 64px;
      color: white;
      background: var(--orange);
      font-size: 16px;
    }

    .action-primary:hover { background: var(--orange-dark); }

    .action-secondary {
      color: var(--green-dark);
      border-color: var(--line);
      background: white;
    }

    .action-secondary:hover { border-color: #a9cbb5; background: #f5faf6; }

    .button-icon {
      width: 24px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 15px;
      line-height: 1;
    }

    .divider {
      height: 1px;
      margin: 21px 0 15px;
      background: var(--line);
    }

    .command-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .command-value {
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      font-weight: 600;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 380px) {
      .remote { padding: 20px; }
      .topline { margin-bottom: 26px; }
      h1 { font-size: 27px; }
      .device-tag { font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="remote">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="favicon.ico" alt="">
        </span>
        <span class="brand-name">Portail de Vital</span>
      </div>
      <span class="device-tag">ESP32 · BLE</span>
    </header>

    <section aria-labelledby="page-title">
      <p class="eyebrow">Télécommande</p>
      <h1 id="page-title">Votre portail,<br>à portée de Téléphone</h1>
      <p class="subtitle">Commande sans fil sécurisée</p>

        <button class="action-button action-primary" id="send" type="button">
          <span class="button-icon" aria-hidden="true">↑</span>
          Ouvrir/Fermer Le portail
        </button>
      </div>
      <div class="actions">
        <button class="action-button action-secondary" id="connect" type="button">
          <span class="button-icon" aria-hidden="true">↔</span>
          Connecter l’ESP32
        </button>
   
      <div class="status-panel" id="status-panel" data-state="waiting" role="status" aria-live="polite">
        <span class="status-light" aria-hidden="true"></span>
        <p id="status">Connexion BLE en attente...</p>
      </div>


      <div class="divider" aria-hidden="true"></div>
      <div class="command-row">
        <span>Dernière commande</span>
        <span class="command-value">Hello ESP32 !</span>
      </div>
    </section>
  </main>

<script>
let characteristicTX;
let device;

const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CHARACTERISTIC_TX_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
const statusElement = document.getElementById("status");
const statusPanel = document.getElementById("status-panel");

function setStatus(message) {
  statusElement.textContent = message;
  const normalizedMessage = message.toLowerCase();
  statusPanel.dataset.state = normalizedMessage.includes("connecté") || normalizedMessage.includes("envoyé")
    ? "connected"
    : normalizedMessage.includes("échec")
      ? "error"
      : "waiting";
}

async function connectToDevice(selectedDevice) {
  device = selectedDevice;
  setStatus(`Connexion à ${device.name || 'l’ESP32'}...`);
  device.addEventListener('gattserverdisconnected', () => {
    characteristicTX = undefined;
    setStatus("ESP32 déconnecté");
  });

  const server = device.gatt.connected
    ? device.gatt
    : await device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  characteristicTX = await service.getCharacteristic(CHARACTERISTIC_TX_UUID);

  setStatus("Connecté à l’ESP32 !");
}

async function reconnectAutomatically() {
  if (!isSecureContext) {
    setStatus("Bluetooth nécessite HTTPS ou localhost.");
    return;
  }

  if (!navigator.bluetooth) {
    setStatus("Web Bluetooth est indisponible. Ouvrez cette page dans Chrome sur HTTPS ou localhost.");
    return;
  }

  if (typeof navigator.bluetooth.getDevices !== "function") {
    setStatus("Chrome ne permet pas de retrouver automatiquement un appareil BLE après le rechargement. Cliquez sur « Connecter ESP32 ».");
    return;
  }

  const devices = await navigator.bluetooth.getDevices();
  const knownDevice = devices.find((knownDevice) =>
    knownDevice.name === 'Portail Vital'
  );

  if (!knownDevice) {
    setStatus("ESP32 non autorisé sur ce site. Cliquez sur « Connecter ESP32 » une première fois.");
    return;
  }

  await connectToDevice(knownDevice);
}

document.getElementById("connect").onclick = async () => {
  try {
    const selectedDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    await connectToDevice(selectedDevice);
  } catch (e) {
    console.error(e);
    setStatus(`Échec de connexion : ${e.message}`);
  }
};

function startAutomaticConnection() {
  reconnectAutomatically().catch((e) => {
    console.error(e);
    setStatus(`Échec de reconnexion : ${e.message}`);
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", startAutomaticConnection, { once: true });
} else {
  startAutomaticConnection();
}

document.getElementById("send").onclick = async () => {
  try {
    if (!characteristicTX) {
      const selectedDevice = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }]
      });
      await connectToDevice(selectedDevice);
    }

    const msg = new TextEncoder().encode("Hello ESP32 !");
    await characteristicTX.writeValue(msg);

    setStatus("Message envoyé !");
    console.log("Message envoyé !");
  } catch (e) {
    console.error(e);
    setStatus(`Échec de connexion ou d’envoi : ${e.message}`);
  }
};

console.log("main");

</script>
</body>
</html>
